<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'Cherish';
            src: url('fonts/cherish free.otf') format('opentype'), url('fonts/cherish free.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            /*
            Tipos de fornat()
            - opentype (otf)
            - truetype (ttf)
            - embedded-opentype
            - truetype-aar (Apple Advanced Typography)
            - svg
            */

        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            font-family: 'Cherish', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Introdução</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Optio saepe similique tempore quo explicabo quibusdam accusantium ad, odit nesciunt minima esse exercitationem! Neque maxime quisquam doloribus officia. Nihil, officiis a.</p>
</body>
</html>
